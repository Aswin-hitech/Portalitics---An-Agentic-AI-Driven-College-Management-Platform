{% extends "base.html" %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto;">
  <div class="ed-card" style="text-align: center;">
    <h2 style="margin-bottom: 0.5rem;">{% if is_admin_login %}Admin Secure Access{% else %}Welcome to Portalitics{% endif %}</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Sign in to your academic portal account</p>

    <form action="/login" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div style="text-align: left; margin-bottom: 1rem;">
        <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-dark);">Email Address</label>
        <input type="email" name="email" placeholder="name@edusphere.edu" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--soft-red-border); margin-top: 0.3rem;" required>
      </div>

      <div style="text-align: left; margin-bottom: 1.5rem;">
        <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-dark);">Password</label>
        <input type="password" name="password" style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid var(--soft-red-border); margin-top: 0.3rem;" required>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">Sign In →</button>
    </form>

    <div style="margin-top: 1.5rem; border-top: 1px solid var(--border-subtle); padding-top: 1rem;">
      <p style="font-size: 0.85rem; color: var(--text-muted);">Account access is provided by your institution. Self-registration is disabled.</p>
    </div>
  </div>
</div>
{% endblock %}
